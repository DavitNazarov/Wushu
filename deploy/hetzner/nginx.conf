# ─────────────────────────────────────────────────────────────────────────────
# nginx reverse proxy for the Hetzner production stack (CURRENT target):
#   - TLS termination (Let's Encrypt certs mounted at /etc/nginx/certs)
#   - WebSocket upgrade for socket.io (/api/socket.io/)
#   - Micro-caching of the anonymous public read endpoints (honours the app's
#     `Cache-Control: public, max-age=30, stale-while-revalidate=120`)
#
# Replace `wushu.example.com` with the real domain before use.
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Real client IP -> the app sets `trust proxy` so req.ip is correct for
  # rate-limit keys and audit logs.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml;

  # Micro-cache for public GETs. nginx respects the upstream Cache-Control, so
  # only the `public, max-age=...` responses from /api/public/* are cached; the
  # GlobalExceptionFilter forces `no-store` on errors so failures are never cached.
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=public_cache:10m
                   max_size=512m inactive=120s use_temp_path=off;

  upstream app_upstream {
    server app:4000;
    keepalive 64;
  }

  # HTTP -> HTTPS redirect.
  server {
    listen 80;
    server_name wushu.example.com;
    # Allow ACME http-01 challenges through if using certbot webroot.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name wushu.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Body cap aligns with the app's 100KB express limit.
    client_max_body_size 128k;

    # WebSocket: socket.io handshake + upgrade. MUST come before the generic
    # /api/ location so the Upgrade headers are applied.
    location /api/socket.io/ {
      proxy_pass http://app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;   # keep long-lived sockets open
      proxy_buffering off;
    }

    # Public read API: cacheable. The app sends stale-while-revalidate, so nginx
    # serves cached content while refreshing in the background -> origin offload.
    location /api/public/ {
      proxy_pass http://app_upstream;
      proxy_cache public_cache;
      proxy_cache_valid 200 30s;
      proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
      proxy_cache_background_update on;
      proxy_cache_lock on;
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Everything else under /api: never cache (auth, mutations).
    location /api/ {
      proxy_pass http://app_upstream;
      proxy_cache off;
    }

    # Next.js frontend (and its static assets) — let Next/its own headers manage
    # caching of /_next/static.
    location / {
      proxy_pass http://app_upstream;
    }
  }
}
