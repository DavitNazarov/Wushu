name: CI

# Runs the checks on every push to main and every pull request, on a clean
# machine — so breakage is caught before it reaches the server.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the older still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint · test · build
    runs-on: ubuntu-latest
    env:
      # Dummy values so env-validation / Prisma client construction don't fail.
      # The unit tests never open a real DB connection.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/test
      JWT_SECRET: ci_dummy_jwt_secret_at_least_32_chars_long_000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npm run prisma:generate -w backend
      # Lint ratchet (M4): the codebase carries a backlog of pre-existing
      # strict-type-aware violations captured in backend/.lint-baseline.json.
      # Rather than block on the whole backlog (or hide it behind
      # continue-on-error, which also masked NEW violations), this gate fails
      # only when the error count INCREASES — so the count can only ratchet down.
      - name: Lint ratchet (no new errors)
        run: npm run lint:ratchet -w backend
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build:backend

  backend-e2e:
    name: Backend — DB-backed e2e
    runs-on: ubuntu-latest
    # Postgres 16 matches production. The job applies real migrations and seeds
    # the mock org/admin, then runs the supertest specs against the live API —
    # the integration coverage the unit job can't provide.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wushu_e2e
        ports:
          - 5432:5432
        # Hold the job until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wushu_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wushu_e2e
      JWT_SECRET: ci_dummy_jwt_secret_at_least_32_chars_long_000
      # Must match seed-mock-data's ORG_SLUG — two e2e specs hit /api/public,
      # which is scoped to this slug.
      PUBLIC_ORG_SLUG: georgian-wushu-federation
      # Test-only: the supertest specs fire many requests back-to-back; the
      # rate limiter would otherwise reject them. Never set this in prod.
      THROTTLE_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npm run prisma:generate -w backend
      - name: Apply migrations (fresh DB)
        run: npm run prisma:migrate:deploy -w backend
      # Seeds the organisation + first admin user the e2e test-context reads via
      # prisma.user.findFirst. SEED_MOCK_DATA=1 is what creates the org/admin.
      - name: Seed org + admin
        run: SEED_MOCK_DATA=1 npm run prisma:seed -w backend
      # --runInBand: the specs share one seeded org/admin; serial execution
      # avoids cross-file DB contention and keeps failures deterministic.
      - name: E2E tests
        run: npm run test:e2e -w backend -- --runInBand

  frontend:
    name: Frontend — lint · build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build:frontend
