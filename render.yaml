# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — Geo Wushu Competition System
#
# CURRENT PRODUCTION TARGET: Render (https://render.com).
# Deploys the COMBINED single-process server (server.js): Next.js serves the
# frontend and mounts the NestJS API under /api on ONE port. See docs/DEPLOYMENT.md.
#
# One-time setup:
#   1. Push this repo to GitHub/GitLab.
#   2. Render Dashboard → New → Blueprint → pick this repo. Render reads this file.
#   3. After the first deploy, copy the service URL (https://<name>.onrender.com)
#      into the FRONTEND_URL and CORS_ALLOWED_ORIGINS env vars, then redeploy.
#      (These are sync:false so they are NOT overwritten on later deploys.)
#
# [FUTURE HETZNER MIGRATION] When moving off Render, this file becomes inert.
# The Docker/compose/nginx equivalents live in deploy/hetzner/ (inactive today).
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: geo-wushu-db
    # Postgres 16 matches docker-compose.yml (local dev) and the migration SQL.
    postgresMajorVersion: "16"
    # Frankfurt = closest region to Georgia. Keep DB + web in the SAME region.
    region: frankfurt
    # plan: free expires after 90 days. Use a paid plan for a real event.
    plan: basic-256mb
    # NOTE: Render Postgres has no PgBouncer by default, so the runtime (pooled)
    # and migration (direct) connection strings are the same here — DATABASE_URL
    # and DIRECT_URL below both point at this DB. If you later switch to Neon,
    # set DIRECT_URL to Neon's *non-pooled* URL (see docs/DEPLOYMENT.md).

services:
  - type: web
    name: geo-wushu
    runtime: node            # Pin native Node runtime so Render ignores any
                             # Dockerfile (the deploy/hetzner/ one is future-only).
    region: frankfurt
    plan: starter            # 512MB. Single instance ONLY — see scaling note below.
    branch: main
    # Node version comes from .nvmrc (22 LTS).
    # Build installs ALL workspace deps (dev deps needed for nest/next build),
    # then builds backend (prisma generate + nest build) and frontend (next build).
    buildCommand: npm ci && npm run build
    # Pre-Deploy runs ONCE per deploy, after build, before traffic shifts.
    # Idempotent: repair-schema (IF NOT EXISTS DDL) then lock-free migrate-deploy.
    preDeployCommand: npm run db:deploy
    startCommand: npm start  # node server.js (NODE_ENV=production set below)
    # Liveness probe. /api/health is constant {ok:true}, no DB hit — a brief DB
    # blip must NOT cause Render to kill a single-instance service. External
    # uptime monitoring can hit /api/ready (DB-aware, returns 503 when DB down).
    healthCheckPath: /api/health
    # IMPORTANT — DO NOT raise numInstances above 1. The app keeps socket.io
    # rooms, rate-limit counters, schedulers (hourly stage-advance, daily token
    # cleanup, 1s fight timer) and JSON exports IN-PROCESS. Two instances would
    # double-fire crons and split socket fan-out. Horizontal scaling needs a
    # Redis adapter + distributed locks first (see deploy/hetzner/README.md).
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Runtime (pooled) connection.
      - key: DATABASE_URL
        fromDatabase:
          name: geo-wushu-db
          property: connectionString
      # Migration/DDL (direct) connection. Same DB on Render (no pooler).
      - key: DIRECT_URL
        fromDatabase:
          name: geo-wushu-db
          property: connectionString
      # ≥32-char secret — Render generates a strong value. Rotating it logs
      # everyone out (invalidates all JWTs). Keep stable.
      - key: JWT_SECRET
        generateValue: true
      # Org slug served on public/unauthenticated pages. MUST match a seeded
      # Organisation.slug. Set after seeding (see docs/DEPLOYMENT.md).
      - key: PUBLIC_ORG_SLUG
        sync: false
      # Set to the service URL after the first deploy, e.g.
      # https://geo-wushu.onrender.com  (boot fails in prod if neither this nor
      # CORS_ALLOWED_ORIGINS is set).
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # 'lax' is correct for a single-origin combined deploy. Only use 'none'
      # (with secure cookies) for a true cross-site frontend/backend split.
      - key: COOKIE_SAME_SITE
        value: lax
      # Guards POST /api/auth/bootstrap-admin (first-admin creation). Set a
      # random value to enable bootstrapping once, then clear it to disable.
      - key: BOOTSTRAP_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info
      # Optional backend error tracking (currently no-op if unset). See H4 in
      # docs/DEPLOYMENT.md "Observability".
      # - key: SENTRY_DSN
      #   sync: false
